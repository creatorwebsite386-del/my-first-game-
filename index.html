<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* Prevents iOS scrolling while playing */
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e15;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Handle screen resize for mobile screens
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Variables
    let score = 0;
    let gameOver = false;
    let obstacles = [];
    let stars = [];
    let frameCount = 0;

    // Player Object
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 100,
      radius: 20,
      color: '#00f3ff'
    };

    // Touch Controls
    function handleTouch(e) {
      if (gameOver) {
        restartGame();
        return;
      }
      const touch = e.touches[0];
      player.x = touch.clientX;
      player.y = touch.clientY - 30; // Offset slightly above touch point
    }

    canvas.addEventListener('touchstart', handleTouch, false);
    canvas.addEventListener('touchmove', handleTouch, false);

    // Obstacle Generator
    function spawnObstacle() {
      const radius = Math.random() * 20 + 15;
      const x = Math.random() * (canvas.width - radius * 2) + radius;
      const speed = Math.random() * 3 + 4 + (score * 0.1);
      obstacles.push({ x, y: -radius, radius, speed, color: '#ff0055' });
    }

    // Star (Point) Generator
    function spawnStar() {
      const radius = 12;
      const x = Math.random() * (canvas.width - radius * 2) + radius;
      const speed = 3;
      stars.push({ x, y: -radius, radius, speed, color: '#ffe600' });
    }

    // Collision Detection
    function checkCollision(circle1, circle2) {
      const dx = circle1.x - circle2.x;
      const dy = circle1.y - circle2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      return distance < circle1.radius + circle2.radius;
    }

    // Restart Setup
    function restartGame() {
      score = 0;
      obstacles = [];
      stars = [];
      gameOver = false;
      player.x = canvas.width / 2;
      player.y = canvas.height - 100;
      animate();
    }

    // Main Game Loop
    function animate() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      // Spawn elements
      if (frameCount % 30 === 0) spawnObstacle();
      if (frameCount % 90 === 0) spawnStar();

      // Draw Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = player.color;
      ctx.fill();
      ctx.closePath();

      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        ctx.fillStyle = obs.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = obs.color;
        ctx.fill();
        ctx.closePath();

        // Check crash
        if (checkCollision(player, obs)) {
          gameOver = true;
        }

        // Remove off-screen
        if (obs.y - obs.radius > canvas.height) {
          obstacles.splice(i, 1);
        }
      }

      // Update & Draw Stars
      for (let i = stars.length - 1; i >= 0; i--) {
        let star = stars[i];
        star.y += star.speed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = star.color;
        ctx.fill();
        ctx.closePath();

        // Collect star
        if (checkCollision(player, star)) {
          score += 10;
          stars.splice(i, 1);
          continue;
        }

        // Remove off-screen
        if (star.y - star.radius > canvas.height) {
          stars.splice(i, 1);
        }
      }

      // Reset Shadow Effects
      ctx.shadowBlur = 0;

      // Draw Score HUD
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px -apple-system, sans-serif';
      ctx.fillText(`Score: ${score}`, 20, 50);

      // Render Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 36px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px -apple-system, sans-serif';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('Tap anywhere to restart', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
        return;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
